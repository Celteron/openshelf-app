name: openreads
description: A mobile books tracker written in Flutter. Free, private and open source.

publish_to: "none"

version: 2.14.0+62

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  xml: ^6.5.0
  mobile_scanner: ^7.4.2
  path_provider: ^2.0.11
  rxdart: ^0.28.0
  path: ^1.9.0
  image_picker: ^1.0.0
  flutter_bloc: ^9.0.0
  image: ^4.0.15
  fl_chart: ^0.70.2
  http: ^1.2.0
  url_launcher: ^6.1.6
  archive: ^4.0.2
  dynamic_color: ^1.6.2
  package_info_plus: ^10.2.2
  shared_preferences: ^2.2.1
  flex_color_picker: ^3.2.2
  csv: ^6.0.0
  file_picker: ^13.3.1
  intl: ^0.20.3
  
  flutter_localizations:
    sdk: flutter
  # Pinned: cancel detection matches the plugin's error message text.
  google_mlkit_document_scanner: 0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.1
  build_runner: ^2.4.13
  test: ^1.25.0

flutter_launcher_icons:
  # Sources and generator: doc/logo/ (make_logo.py), then `dart run flutter_launcher_icons`.
  android: true
  image_path: "doc/logo/generated/icon.png"
  adaptive_icon_foreground: "doc/logo/generated/foreground.png"
  adaptive_icon_background: "doc/logo/generated/background.png"
  adaptive_icon_monochrome: "doc/logo/generated/monochrome.png"
  min_sdk_android: 24
  ios: true
  image_path_ios: "doc/logo/generated/icon_ios.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/translations/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: SofiaSans
      fonts:
        - asset: assets/fonts/SofiaSans-Regular.ttf
        - asset: assets/fonts/SofiaSans-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Regular.ttf
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Regular.ttf
        - asset: assets/fonts/Jost-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/Atkinson-Hyperlegible-Regular-102.ttf
