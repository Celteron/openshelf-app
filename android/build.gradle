allprojects {
    repositories {
        google()
        mavenCentral()
        // Tesseract4Android (OCR for quote photos) is published on JitPack
        // only. Exclusive: this group is never looked up anywhere else, and
        // nothing else is looked up on JitPack.
        exclusiveContent {
            forRepository {
                maven { url 'https://jitpack.io' }
            }
            filter {
                includeGroup 'cz.adaptech.tesseract4android'
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
